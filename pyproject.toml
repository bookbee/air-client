[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "air-client"
version = "0.1.0"
description = "AIR Client — a Streamlit console for exercising the AIR services by hand"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Vikas Roy" }]

dependencies = [
    "streamlit>=1.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/air_client"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
